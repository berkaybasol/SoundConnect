server:
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbit,webSocketBrokerRelayHealth,tableGroupNotificationOutboxHealth,eventPerformerNotificationOutboxHealth

app:
  websocket:
    broker-relay:
      enabled: true
  listener-profile:
    visibility-rate-limit:
      enabled: true
    playlist-rate-limit:
      enabled: true
  musician-profile:
    calendar-rate-limit:
      enabled: true
  feed:
    musician:
      enabled: ${SOUNDCONNECT_MUSICIAN_FEED_ENABLED:false}
      cursor-secret: ${SOUNDCONNECT_MUSICIAN_FEED_CURSOR_SECRET:}
      cursor-ttl: ${SOUNDCONNECT_MUSICIAN_FEED_CURSOR_TTL:PT24H}
      delivery-secret: ${SOUNDCONNECT_MUSICIAN_FEED_DELIVERY_SECRET:}
      delivery-ttl: ${SOUNDCONNECT_MUSICIAN_FEED_DELIVERY_TTL:PT24H}
      delivery-retention: ${SOUNDCONNECT_MUSICIAN_FEED_DELIVERY_RETENTION:P90D}
      telemetry-retention: ${SOUNDCONNECT_MUSICIAN_FEED_TELEMETRY_RETENTION:P90D}
      telemetry-clock-skew: ${SOUNDCONNECT_MUSICIAN_FEED_TELEMETRY_CLOCK_SKEW:PT10M}
      provider-deadline: ${SOUNDCONNECT_MUSICIAN_FEED_PROVIDER_DEADLINE:PT4S}
      provider-parallelism: ${SOUNDCONNECT_MUSICIAN_FEED_PROVIDER_PARALLELISM:6}
      provider-queue-capacity: ${SOUNDCONNECT_MUSICIAN_FEED_PROVIDER_QUEUE_CAPACITY:24}
      sponsor-campaign-daily-cap: ${SOUNDCONNECT_MUSICIAN_FEED_SPONSOR_DAILY_CAP:3}
      cleanup-batch-size: ${SOUNDCONNECT_MUSICIAN_FEED_CLEANUP_BATCH_SIZE:1000}
      cleanup-max-batches: ${SOUNDCONNECT_MUSICIAN_FEED_CLEANUP_MAX_BATCHES:20}
      cleanup-time-budget: ${SOUNDCONNECT_MUSICIAN_FEED_CLEANUP_TIME_BUDGET:PT5S}
      cleanup-cron: "${SOUNDCONNECT_MUSICIAN_FEED_CLEANUP_CRON:0 */5 * * * *}"
      cleanup-enabled: ${SOUNDCONNECT_MUSICIAN_FEED_CLEANUP_ENABLED:false}
      max-session-deliveries: ${SOUNDCONNECT_MUSICIAN_FEED_MAX_SESSION_DELIVERIES:2000}
      default-page-size: ${SOUNDCONNECT_MUSICIAN_FEED_DEFAULT_PAGE_SIZE:20}
      max-page-size: ${SOUNDCONNECT_MUSICIAN_FEED_MAX_PAGE_SIZE:50}
      provider-limit: ${SOUNDCONNECT_MUSICIAN_FEED_PROVIDER_LIMIT:160}
      mock-sponsors-enabled: false
      rate-limit:
        enabled: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_ENABLED:true}
        key-prefix: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_KEY_PREFIX:soundconnect:musician-feed:rate-limit}
        initial:
          burst-capacity: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_INITIAL_BURST:4}
          refill-period: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_INITIAL_REFILL:PT15S}
        continuation:
          burst-capacity: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_CONTINUATION_BURST:12}
          refill-period: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_CONTINUATION_REFILL:PT2S}
        shared-page-budget:
          burst-capacity: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_PAGE_BURST:30}
          refill-period: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_PAGE_REFILL:PT3S}
        telemetry:
          burst-capacity: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_TELEMETRY_BURST:120}
          refill-period: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_TELEMETRY_REFILL:PT0.25S}
        unavailable-retry-after: ${SOUNDCONNECT_MUSICIAN_FEED_RATE_LIMIT_UNAVAILABLE_RETRY_AFTER:PT5S}
  table-group:
    rate-limit:
      enabled: true
  cors:
    allowed-origin-patterns: ${SOUNDCONNECT_CORS_ALLOWED_ORIGIN_PATTERNS}
  security:
    auth-rate-limit:
      # Leave empty when directly Internet-facing; otherwise list only the
      # exact private/load-balancer networks that operate the ingress.
      trusted-proxy-cidrs: ${AUTH_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
      forwarded-header: ${AUTH_RATE_LIMIT_FORWARDED_HEADER:FORWARDED}
  data:
    init:
      enabled: false
      owner:
        enabled: false
        minimum-password-length: 16
  location:
    seed:
      enabled: false
  instrument:
    catalog:
      seed:
        enabled: ${SOUNDCONNECT_INSTRUMENT_CATALOG_SEED_ENABLED:false}
  backline:
    catalog:
      seed:
        enabled: ${SOUNDCONNECT_BACKLINE_CATALOG_SEED_ENABLED:false}

mailersend:
  api-key: ${MAILERSEND_API_KEY}
  from-email: ${MAILERSEND_SENDER_EMAIL}

cloud:
  storage:
    bucket: ${S3_BUCKET}
    # Must be non-CDN. Apply the checked-in lifecycle only to quarantine/.
    # verified/ can be a live video source; private-verified/ is protected media.
    privateBucket: ${S3_PRIVATE_BUCKET}
    region: ${AWS_REGION}
    accessKey: ${S3_ACCESS_KEY:}
    secretKey: ${S3_SECRET_KEY:}
    cdnBaseUrl: ${S3_CDN_BASE_URL:}

media:
  image-variants:
    worker:
      enabled: false
  transcode:
    # Production API nodes must never fork FFmpeg. A separate least-privilege
    # worker deployment remains a documented release blocker.
    worker:
      enabled: false
  upload-verification:
    enabled: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_ENABLED:true}
    request-wait-timeout: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_REQUEST_WAIT_TIMEOUT:PT4S}
    verification-lease: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_LEASE:PT4M}
    attempt-hard-timeout: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_ATTEMPT_HARD_TIMEOUT:PT5M}
    storage-call-timeout: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_STORAGE_CALL_TIMEOUT:PT30S}
  upload-guard:
    enabled: ${SOUNDCONNECT_MEDIA_UPLOAD_GUARD_ENABLED:true}
    fail-open: ${SOUNDCONNECT_MEDIA_UPLOAD_GUARD_FAIL_OPEN:false}
  upload-cleanup:
    enabled: ${SOUNDCONNECT_MEDIA_UPLOAD_CLEANUP_ENABLED:true}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.berkayb.soundconnect: INFO
