<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"/>
    <title>Setlist</title>
    <link rel="stylesheet" href="setlist.css"/>
</head>

<body>
<div class="page">

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <img src="logo.svg" alt="SoundConnect Logo" class="logo"/>
            <div class="brand-text">
                <h1 class="setlist-title">SETLIST</h1>
                <span class="venue-name">IF Performance Hall</span>
            </div>
        </div>

        <div class="meta">
            <span class="date">10 Aralık 2025</span>
            <span class="artist">B-Boy Trio</span>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="content">

        <!-- SET -->
        <section class="set">
            <h2 class="set-title">SET 1</h2>

            <ol class="song-list">
                <li>
                    <span class="song-name">Dreams</span>
                    <span class="song-note">Intro long</span>
                </li>
                <li>
                    <span class="song-name">Night Drive</span>
                </li>
                <li>
                    <span class="song-name">Echoes</span>
                </li>
            </ol>
        </section>

        <section class="set">
            <h2 class="set-title">SET 2</h2>

            <ol class="song-list">
                <li>
                    <span class="song-name">Backstage</span>
                </li>
                <li>
                    <span class="song-name">Final Act</span>
                    <span class="song-note">Encore</span>
                </li>
            </ol>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <span>Generated by SoundConnect</span>
    </footer>

</div>
</body>
</html>
