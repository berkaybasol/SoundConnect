server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  # Keep the transport peer intact. Forwarding headers are parsed only by the
  # auth limiter and only for explicitly trusted proxy CIDRs.
  forward-headers-strategy: none
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  config:
    # Lets IntelliJ/Gradle load ignored local secrets without storing them in a run configuration.
    # The file is absent from container images; Compose injects the same values as environment variables.
    import: optional:file:.env.local[.properties]
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  jackson:
    time-zone: UTC
  datasource:
    url: ${SOUNDCONNECT_POSTGRES_URL:${SOUNDCONNECT_POSTGRE_URL:${SPRING_DATASOURCE_URL}}}
    username: ${SOUNDCONNECT_POSTGRES_USERNAME:${SOUNDCONNECT_POSTGRE_USERNAME:${SPRING_DATASOURCE_USERNAME}}}
    password: ${SOUNDCONNECT_POSTGRES_PASSWORD:${SOUNDCONNECT_POSTGRE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Use application-namespaced environment variables. Supplying
      # SPRING_DATASOURCE_HIKARI_* directly would also participate in relaxed
      # binding and can attempt to reconfigure an already-started pool.
      maximum-pool-size: ${SOUNDCONNECT_POSTGRES_POOL_MAX_SIZE:10}
      minimum-idle: ${SOUNDCONNECT_POSTGRES_POOL_MIN_IDLE:2}
      connection-timeout: ${SOUNDCONNECT_POSTGRES_POOL_CONNECTION_TIMEOUT_MS:30000}
      # JPQL bulk updates use database CURRENT_TIMESTAMP; force the same UTC
      # wall clock as JPA auditing and application lifecycle cutoffs.
      connection-init-sql: "SET TIME ZONE 'UTC'"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # degistirildi
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
        type:
          descriptor:
            sql: trace
    # Transitional compatibility: disable only after the service/fetch-plan audit
    # (including Studio) is completed with database-backed endpoint tests.
    open-in-view: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5673}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${SPRING_RABBITMQ_CONNECTION_TIMEOUT:10s}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true  # publish-returns çalışsın (routing yoksa yakalayabilelim)

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            scope: [openid, email, profile]
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: email

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
    rest:
      default-media-type:
  hateoas:
    use-hal-as-default-json-media-type:

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      status:
        order: down,out-of-service,degraded,unknown,up
        http-mapping:
          down: 503
          out-of-service: 503
          degraded: 200

app:
  websocket:
    broker-relay:
      enabled: ${SOUNDCONNECT_WEBSOCKET_BROKER_RELAY_ENABLED:false}
      host: ${SOUNDCONNECT_WEBSOCKET_BROKER_RELAY_HOST:${SPRING_RABBITMQ_HOST:localhost}}
      port: ${SOUNDCONNECT_WEBSOCKET_BROKER_RELAY_PORT:61613}
      login: ${SOUNDCONNECT_WEBSOCKET_BROKER_RELAY_LOGIN:${SPRING_RABBITMQ_USERNAME:guest}}
      passcode: ${SOUNDCONNECT_WEBSOCKET_BROKER_RELAY_PASSCODE:${SPRING_RABBITMQ_PASSWORD:guest}}
      virtual-host: ${SOUNDCONNECT_WEBSOCKET_BROKER_RELAY_VHOST:${SPRING_RABBITMQ_VIRTUAL_HOST:/}}
  listener-profile:
    visibility-rate-limit:
      enabled: ${LISTENER_VISIBILITY_RATE_LIMIT_ENABLED:true}
      key-prefix: ${LISTENER_VISIBILITY_RATE_LIMIT_KEY_PREFIX:soundconnect:listener-profile:visibility-rate-limit}
      burst-capacity: ${LISTENER_VISIBILITY_RATE_LIMIT_BURST_CAPACITY:3}
      refill-period: ${LISTENER_VISIBILITY_RATE_LIMIT_REFILL_PERIOD:10s}
  table-group:
    chat:
      unread-ttl: ${TABLE_GROUP_CHAT_UNREAD_TTL:PT720H}
      retention: ${TABLE_GROUP_CHAT_RETENTION:P30D}
    rate-limit:
      enabled: ${TABLE_GROUP_RATE_LIMIT_ENABLED:true}
      key-prefix: ${TABLE_GROUP_RATE_LIMIT_KEY_PREFIX:soundconnect:table-group:rate-limit}
      create:
        limit: ${TABLE_GROUP_CREATE_RATE_LIMIT:10}
        window: ${TABLE_GROUP_CREATE_RATE_WINDOW:1h}
      join:
        limit: ${TABLE_GROUP_JOIN_RATE_LIMIT:60}
        window: ${TABLE_GROUP_JOIN_RATE_WINDOW:1h}
      message-per-table:
        limit: ${TABLE_GROUP_MESSAGE_TABLE_RATE_LIMIT:60}
        window: ${TABLE_GROUP_MESSAGE_TABLE_RATE_WINDOW:1m}
      message-global:
        limit: ${TABLE_GROUP_MESSAGE_GLOBAL_RATE_LIMIT:120}
        window: ${TABLE_GROUP_MESSAGE_GLOBAL_RATE_WINDOW:1m}
      message-table-global:
        limit: ${TABLE_GROUP_MESSAGE_TABLE_GLOBAL_RATE_LIMIT:120}
        window: ${TABLE_GROUP_MESSAGE_TABLE_GLOBAL_RATE_WINDOW:1m}
      game-create:
        limit: ${TABLE_GROUP_GAME_CREATE_RATE_LIMIT:10}
        window: ${TABLE_GROUP_GAME_CREATE_RATE_WINDOW:1h}
      game-command:
        limit: ${TABLE_GROUP_GAME_COMMAND_RATE_LIMIT:60}
        window: ${TABLE_GROUP_GAME_COMMAND_RATE_WINDOW:1m}
      game-read:
        limit: ${TABLE_GROUP_GAME_READ_RATE_LIMIT:120}
        window: ${TABLE_GROUP_GAME_READ_RATE_WINDOW:1m}
  jwt:
    secret: ${SOUNDCONNECT_JWT_SECRETKEY}
    expiration: ${SOUNDCONNECT_JWT_EXTIME}
    issuer: ${SOUNDCONNECT_JWT_ISSUER}
  cors:
    allowed-origin-patterns: "${SOUNDCONNECT_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}"
  security:
    auth-rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      key-prefix: ${AUTH_RATE_LIMIT_KEY_PREFIX:soundconnect:auth-rate-limit}
      trusted-proxy-cidrs: ${AUTH_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
      forwarded-header: ${AUTH_RATE_LIMIT_FORWARDED_HEADER:FORWARDED}
      login:
        limit: ${AUTH_RATE_LIMIT_LOGIN_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_LOGIN_WINDOW:1m}
      google-login:
        limit: ${AUTH_RATE_LIMIT_GOOGLE_LOGIN_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_GOOGLE_LOGIN_WINDOW:1m}
      register:
        limit: ${AUTH_RATE_LIMIT_REGISTER_LIMIT:5}
        window: ${AUTH_RATE_LIMIT_REGISTER_WINDOW:5m}
      otp-verify:
        limit: ${AUTH_RATE_LIMIT_OTP_VERIFY_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_OTP_VERIFY_WINDOW:5m}
      otp-resend:
        limit: ${AUTH_RATE_LIMIT_OTP_RESEND_LIMIT:3}
        window: ${AUTH_RATE_LIMIT_OTP_RESEND_WINDOW:5m}
      username-availability:
        limit: ${AUTH_RATE_LIMIT_USERNAME_AVAILABILITY_LIMIT:30}
        window: ${AUTH_RATE_LIMIT_USERNAME_AVAILABILITY_WINDOW:1m}
      password-reset-lookup:
        limit: ${AUTH_RATE_LIMIT_PASSWORD_RESET_LOOKUP_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_PASSWORD_RESET_LOOKUP_WINDOW:5m}
      password-reset-request:
        limit: ${AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_LIMIT:3}
        window: ${AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW:5m}
      password-reset-confirm:
        limit: ${AUTH_RATE_LIMIT_PASSWORD_RESET_CONFIRM_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_PASSWORD_RESET_CONFIRM_WINDOW:5m}
  notification:
    retention-days: ${SOUNDCONNECT_NOTIFICATION_RETENTION_DAYS:30}
    cleanup-cron: "${SOUNDCONNECT_NOTIFICATION_CLEANUP_CRON:0 20 4 * * *}"
    table-group-outbox:
      batch-size: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_BATCH_SIZE:25}
      max-attempts: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_MAX_ATTEMPTS:8}
      worker-threads: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_WORKER_THREADS:2}
      queue-capacity: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_QUEUE_CAPACITY:250}
      poll-delay-ms: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_POLL_DELAY_MS:5000}
      initial-delay-ms: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_INITIAL_DELAY_MS:5000}
      lease-duration: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_LEASE_DURATION:30s}
      retry-initial-delay: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_RETRY_INITIAL_DELAY:5s}
      retry-max-delay: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_RETRY_MAX_DELAY:15m}
      published-retention: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_PUBLISHED_RETENTION:7d}
      health-undelivered-age-threshold: ${SOUNDCONNECT_TABLE_GROUP_OUTBOX_HEALTH_AGE_THRESHOLD:30m}
      cleanup-cron: "${SOUNDCONNECT_TABLE_GROUP_OUTBOX_CLEANUP_CRON:0 40 4 * * *}"
    collab-outbox:
      batch-size: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_BATCH_SIZE:25}
      max-attempts: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:8}
      worker-threads: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_WORKER_THREADS:2}
      queue-capacity: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_QUEUE_CAPACITY:250}
      poll-delay-ms: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_POLL_DELAY_MS:5000}
      initial-delay-ms: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_INITIAL_DELAY_MS:5000}
      lease-duration: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_LEASE_DURATION:30s}
      retry-initial-delay: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_RETRY_INITIAL_DELAY:5s}
      retry-max-delay: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_RETRY_MAX_DELAY:15m}
      published-retention: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_PUBLISHED_RETENTION:7d}
      health-undelivered-age-threshold: ${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_HEALTH_UNDELIVERED_AGE_THRESHOLD:30m}
      cleanup-cron: "${SOUNDCONNECT_COLLAB_NOTIFICATION_OUTBOX_CLEANUP_CRON:0 35 4 * * *}"
  share-base-url: ${APP_SHARE_BASE_URL:http://localhost:8080}
  data:
    init:
      enabled: ${SOUNDCONNECT_DATA_INIT_ENABLED:true}
      owner:
        enabled: ${SOUNDCONNECT_BOOTSTRAP_OWNER_ENABLED:false}
        username: ${SOUNDCONNECT_BOOTSTRAP_OWNER_USERNAME:}
        password: ${SOUNDCONNECT_BOOTSTRAP_OWNER_PASSWORD:}
        email: ${SOUNDCONNECT_BOOTSTRAP_OWNER_EMAIL:}
        phone: ${SOUNDCONNECT_BOOTSTRAP_OWNER_PHONE:}
        city: ${SOUNDCONNECT_BOOTSTRAP_OWNER_CITY:}
        minimum-password-length: ${SOUNDCONNECT_BOOTSTRAP_OWNER_MIN_PASSWORD_LENGTH:16}
  location:
    seed:
      enabled: ${SOUNDCONNECT_LOCATION_SEED_ENABLED:true}
  instrument:
    catalog:
      seed:
        enabled: ${SOUNDCONNECT_INSTRUMENT_CATALOG_SEED_ENABLED:true}
  backline:
    catalog:
      seed:
        enabled: ${SOUNDCONNECT_BACKLINE_CATALOG_SEED_ENABLED:true}
  messaging:
    notification:
      exchange: notification.exchange
      queue: notification.queue
      routingKey: notification.#
      publishRoutingKey: notification.event
      publisher-confirm-timeout: ${SOUNDCONNECT_NOTIFICATION_PUBLISHER_CONFIRM_TIMEOUT:5s}
      dlxExchange: notification.dlx
      dlq: notification.queue.dlq

otp:
  ttl:
    minutes: ${SOUNDCONNECT_OTP_TTL_MINUTES:3}
  length: ${SOUNDCONNECT_OTP_LENGTH:6}
  max-attempt: ${SOUNDCONNECT_OTP_MAX_ATTEMPTS:5}
  resend:
    cooldown:
      seconds: ${SOUNDCONNECT_OTP_RESEND_COOLDOWN_SECONDS:30}

mailersend:
  api-key: ${MAILERSEND_API_KEY}
  from-email: ${MAILERSEND_SENDER_EMAIL}
  from-name: ${MAILERSEND_SENDER_NAME:SoundConnect}
  connectTimeoutMs: ${MAILERSEND_CONNECT_TIMEOUT_MS:5000}
  readTimeoutSec: ${MAILERSEND_READ_TIMEOUT_SECONDS:8}
  otp-validity-minutes: ${SOUNDCONNECT_OTP_TTL_MINUTES:3}

# -------- MAIL (yeni) --------
mail:
  exchange: ${SOUNDCONNECT_MAIL_EXCHANGE:mail.exchange}
  routingKey: ${SOUNDCONNECT_MAIL_ROUTING_KEY:mail.send}
  queueName: ${SOUNDCONNECT_MAIL_QUEUE:mail.queue}
  dlx: ${SOUNDCONNECT_MAIL_DLX:mail.dlx}
  dlq: ${SOUNDCONNECT_MAIL_DLQ:mail.queue.dlq}
  ttlMs: ${SOUNDCONNECT_MAIL_TTL_MS:120000}
  listener:
    concurrency: ${SOUNDCONNECT_MAIL_LISTENER_CONCURRENCY:1-5}
    prefetch: ${SOUNDCONNECT_MAIL_LISTENER_PREFETCH:10}
  idempotencyTtlSec: ${SOUNDCONNECT_MAIL_IDEMPOTENCY_TTL_SECONDS:900}
  lockTtlSec: ${SOUNDCONNECT_MAIL_LOCK_TTL_SECONDS:300}
  producer:
    confirmTimeoutSec: ${SOUNDCONNECT_MAIL_CONFIRM_TIMEOUT_SECONDS:5}
  maxRedeliveries: ${SOUNDCONNECT_MAIL_MAX_REDELIVERIES:5}
  delayed:
    exchange: ${SOUNDCONNECT_MAIL_DELAYED_EXCHANGE:mail.delayed}
  retry:
    delaysMs: ${SOUNDCONNECT_MAIL_RETRY_DELAYS_MS:3000,10000,30000}
    useRetryAfter: ${SOUNDCONNECT_MAIL_USE_RETRY_AFTER:true}

# -----------------------------

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOGGING_LEVEL_SPRING_WEB:INFO}
    org.hibernate.SQL: OFF  # degistirildi
    org.hibernate.orm.jdbc.bind: OFF  # eklendi
    org.hibernate.type.descriptor.sql.BasicBinder: OFF  # eklendi
    com.berkayb.soundconnect: ${LOGGING_LEVEL_SOUNDCONNECT:DEBUG}

# --- MEDIA / STORAGE ---
cloud:
  storage:
    provider: ${S3_PROVIDER:s3}
    bucket: ${S3_BUCKET:soundconnect-media}
    # Non-CDN origin for protected media and untrusted quarantine/ uploads.
    # Lifecycle backstop covers only quarantine/. verified/ may be live video source.
    privateBucket: ${S3_PRIVATE_BUCKET:soundconnect-private-media}
    region: ${AWS_REGION:eu-central-1}
    accessKey: ${S3_ACCESS_KEY:}
    secretKey: ${S3_SECRET_KEY:}
    cdnBaseUrl: ${S3_CDN_BASE_URL:https://du3pguch18ell.cloudfront.net}
    endpoint: ${S3_ENDPOINT:}
    pathStyleAccess: ${S3_PATH_STYLE_ACCESS:false}
    presign:
      uploadExpirySeconds: ${S3_UPLOAD_PRESIGN_EXPIRY_SECONDS:${S3_PRESIGN_EXPIRY_SECONDS:900}}
      downloadExpirySeconds: ${S3_DOWNLOAD_PRESIGN_EXPIRY_SECONDS:300}
    aclPublicReadOnPut: ${S3_ACL_PUBLIC_READ_ON_PUT:false}
    # Optional. When present, deletion submits one /media/{assetId}/* purge.
    cloudfront:
      distributionId: ${S3_CLOUDFRONT_DISTRIBUTION_ID:}
    # Hard runtime ceilings also cover HLS producers and are the deletion-SLA
    # fallback when CloudFront invalidation is not configured.
    cache:
      publicMaxAgeSeconds: ${S3_PUBLIC_CACHE_MAX_AGE_SECONDS:300}
      sharedMaxAgeSeconds: ${S3_SHARED_CACHE_MAX_AGE_SECONDS:3600}

media:
  upload-verification:
    enabled: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_ENABLED:true}
    worker-threads: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_WORKER_THREADS:4}
    queue-capacity: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_QUEUE_CAPACITY:100}
    recovery-batch-size: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_RECOVERY_BATCH_SIZE:50}
    request-wait-timeout: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_REQUEST_WAIT_TIMEOUT:PT4S}
    verification-lease: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_LEASE:PT4M}
    attempt-hard-timeout: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_ATTEMPT_HARD_TIMEOUT:PT5M}
    storage-call-timeout: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_STORAGE_CALL_TIMEOUT:PT30S}
    recovery-initial-delay-ms: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_RECOVERY_INITIAL_DELAY_MS:15000}
    recovery-fixed-delay-ms: ${SOUNDCONNECT_MEDIA_UPLOAD_VERIFICATION_RECOVERY_FIXED_DELAY_MS:30000}
  image-variants:
    worker:
      enabled: ${SOUNDCONNECT_MEDIA_IMAGE_VARIANT_WORKER_ENABLED:true}
    public-cache-control: "${SOUNDCONNECT_MEDIA_PUBLIC_CACHE_CONTROL:public, max-age=300, s-maxage=3600, stale-while-revalidate=60}"
    thumbnail-max-dimension: ${SOUNDCONNECT_MEDIA_THUMBNAIL_MAX_DIMENSION:960}
    max-source-pixels: ${SOUNDCONNECT_MEDIA_IMAGE_MAX_SOURCE_PIXELS:60000000}
    jpeg-quality: ${SOUNDCONNECT_MEDIA_THUMBNAIL_JPEG_QUALITY:0.82}
    process-timeout-seconds: ${SOUNDCONNECT_MEDIA_THUMBNAIL_PROCESS_TIMEOUT_SECONDS:30}
    backfill:
      enabled: ${SOUNDCONNECT_MEDIA_THUMBNAIL_BACKFILL_ENABLED:true}
      batch-size: ${SOUNDCONNECT_MEDIA_THUMBNAIL_BACKFILL_BATCH_SIZE:25}
      worker-threads: ${SOUNDCONNECT_MEDIA_THUMBNAIL_WORKER_THREADS:2}
      queue-capacity: ${SOUNDCONNECT_MEDIA_THUMBNAIL_QUEUE_CAPACITY:100}
      initial-delay: ${SOUNDCONNECT_MEDIA_THUMBNAIL_BACKFILL_INITIAL_DELAY:PT2M}
      fixed-delay: ${SOUNDCONNECT_MEDIA_THUMBNAIL_BACKFILL_FIXED_DELAY:PT10M}
  upload-guard:
    enabled: ${SOUNDCONNECT_MEDIA_UPLOAD_GUARD_ENABLED:true}
    # Signed upload creation is storage-expensive, so protection is fail-closed
    # unless an operator explicitly accepts degraded abuse protection.
    fail-open: ${SOUNDCONNECT_MEDIA_UPLOAD_GUARD_FAIL_OPEN:false}
    key-prefix: ${SOUNDCONNECT_MEDIA_UPLOAD_GUARD_KEY_PREFIX:soundconnect:media-upload}
    max-requests-per-window: ${SOUNDCONNECT_MEDIA_UPLOAD_MAX_REQUESTS:20}
    max-bytes-per-window: ${SOUNDCONNECT_MEDIA_UPLOAD_MAX_BYTES:8000000000}
    window: ${SOUNDCONNECT_MEDIA_UPLOAD_WINDOW:1h}
    max-concurrent-uploads: ${SOUNDCONNECT_MEDIA_UPLOAD_MAX_CONCURRENT:4}
    reservation-ttl: ${SOUNDCONNECT_MEDIA_UPLOAD_RESERVATION_TTL:30m}
  upload-cleanup:
    enabled: ${SOUNDCONNECT_MEDIA_UPLOAD_CLEANUP_ENABLED:true}
    stale-after: ${SOUNDCONNECT_MEDIA_UPLOAD_STALE_AFTER:2h}
    batch-size: ${SOUNDCONNECT_MEDIA_UPLOAD_CLEANUP_BATCH_SIZE:100}
    worker-threads: ${SOUNDCONNECT_MEDIA_UPLOAD_CLEANUP_WORKER_THREADS:4}
    queue-capacity: ${SOUNDCONNECT_MEDIA_UPLOAD_CLEANUP_QUEUE_CAPACITY:200}
    initial-delay-ms: ${SOUNDCONNECT_MEDIA_UPLOAD_CLEANUP_INITIAL_DELAY_MS:600000}
    fixed-delay-ms: ${SOUNDCONNECT_MEDIA_UPLOAD_CLEANUP_FIXED_DELAY_MS:900000}
    presign-clock-skew: ${SOUNDCONNECT_MEDIA_UPLOAD_PRESIGN_CLOCK_SKEW:PT1M}
    # S3 validates expiry when a PUT starts; a transfer already in progress may
    # finish later. Durable cleanup intents survive this bounded completion grace.
    in-flight-completion-grace: ${SOUNDCONNECT_MEDIA_UPLOAD_IN_FLIGHT_COMPLETION_GRACE:PT24H}
    protected-mutable-recovery-enabled: ${SOUNDCONNECT_MEDIA_PROTECTED_MUTABLE_RECOVERY_ENABLED:true}
    protected-mutable-recovery-batch-size: ${SOUNDCONNECT_MEDIA_PROTECTED_MUTABLE_RECOVERY_BATCH_SIZE:100}
    protected-mutable-recovery-worker-threads: ${SOUNDCONNECT_MEDIA_PROTECTED_MUTABLE_RECOVERY_WORKER_THREADS:2}
    protected-mutable-recovery-queue-capacity: ${SOUNDCONNECT_MEDIA_PROTECTED_MUTABLE_RECOVERY_QUEUE_CAPACITY:200}
  public-promotion-recovery:
    enabled: ${SOUNDCONNECT_MEDIA_PUBLIC_PROMOTION_RECOVERY_ENABLED:true}
    batch-size: ${SOUNDCONNECT_MEDIA_PUBLIC_PROMOTION_RECOVERY_BATCH_SIZE:100}
    worker-threads: ${SOUNDCONNECT_MEDIA_PUBLIC_PROMOTION_RECOVERY_WORKER_THREADS:2}
    queue-capacity: ${SOUNDCONNECT_MEDIA_PUBLIC_PROMOTION_RECOVERY_QUEUE_CAPACITY:200}
  deletion:
    enabled: ${SOUNDCONNECT_MEDIA_DELETION_ENABLED:true}
    batch-size: ${SOUNDCONNECT_MEDIA_DELETION_BATCH_SIZE:100}
    worker-threads: ${SOUNDCONNECT_MEDIA_DELETION_WORKER_THREADS:2}
    queue-capacity: ${SOUNDCONNECT_MEDIA_DELETION_QUEUE_CAPACITY:100}
    # Logical deletion is immediate. Physical removal waits for producers that
    # may already hold a pre-delete snapshot, then performs a deterministic sweep.
    public-image-producer-grace: ${SOUNDCONNECT_MEDIA_DELETION_IMAGE_PRODUCER_GRACE:PT5M}
    public-video-producer-grace: ${SOUNDCONNECT_MEDIA_DELETION_VIDEO_PRODUCER_GRACE:PT14H}
  transcode:
    worker:
      enabled: ${SOUNDCONNECT_MEDIA_TRANSCODE_WORKER_ENABLED:true}
    dispatch:
      enabled: ${SOUNDCONNECT_MEDIA_TRANSCODE_DISPATCH_ENABLED:true}
      batch-size: ${SOUNDCONNECT_MEDIA_TRANSCODE_DISPATCH_BATCH_SIZE:50}
      worker-threads: ${SOUNDCONNECT_MEDIA_TRANSCODE_DISPATCH_WORKER_THREADS:2}
      queue-capacity: ${SOUNDCONNECT_MEDIA_TRANSCODE_DISPATCH_QUEUE_CAPACITY:100}
      initial-delay-ms: ${SOUNDCONNECT_MEDIA_TRANSCODE_DISPATCH_INITIAL_DELAY_MS:15000}
      fixed-delay-ms: ${SOUNDCONNECT_MEDIA_TRANSCODE_DISPATCH_FIXED_DELAY_MS:30000}
    # Non-renewable upper bound for any writes by one attempt. The short lease
    # detects crashes; this hard bound fences late writers to deterministic HLS.
    processing-timeout-hours: ${SOUNDCONNECT_MEDIA_TRANSCODE_PROCESSING_TIMEOUT_HOURS:12}
    lease:
      duration: ${SOUNDCONNECT_MEDIA_TRANSCODE_LEASE_DURATION:PT15M}
      heartbeat-interval: ${SOUNDCONNECT_MEDIA_TRANSCODE_HEARTBEAT_INTERVAL:PT1M}
      heartbeat-threads: ${SOUNDCONNECT_MEDIA_TRANSCODE_HEARTBEAT_THREADS:4}
      max-attempts: ${SOUNDCONNECT_MEDIA_TRANSCODE_MAX_ATTEMPTS:3}
      retry-backoff-base: ${SOUNDCONNECT_MEDIA_TRANSCODE_RETRY_BACKOFF_BASE:PT1H}
      retry-backoff-max: ${SOUNDCONNECT_MEDIA_TRANSCODE_RETRY_BACKOFF_MAX:PT4H}
    # One worker per node avoids concurrent per-job disk reservations racing.
    worker-threads: ${SOUNDCONNECT_MEDIA_TRANSCODE_WORKER_THREADS:1}
    sent-recovery-delay: ${SOUNDCONNECT_MEDIA_TRANSCODE_SENT_RECOVERY_DELAY:PT5M}
    sent-recovery-initial-delay-ms: ${SOUNDCONNECT_MEDIA_TRANSCODE_SENT_RECOVERY_INITIAL_DELAY_MS:60000}
    sent-recovery-check-ms: ${SOUNDCONNECT_MEDIA_TRANSCODE_SENT_RECOVERY_CHECK_MS:60000}
    stale-job-initial-delay-ms: ${SOUNDCONNECT_MEDIA_TRANSCODE_STALE_INITIAL_DELAY_MS:60000}
    stale-job-check-ms: ${SOUNDCONNECT_MEDIA_TRANSCODE_STALE_CHECK_MS:3600000}
    hls-cleanup-quiet-period-hours: ${SOUNDCONNECT_MEDIA_HLS_CLEANUP_QUIET_PERIOD_HOURS:1}
    hls-cleanup-initial-delay-ms: ${SOUNDCONNECT_MEDIA_HLS_CLEANUP_INITIAL_DELAY_MS:90000}
    hls-cleanup-check-ms: ${SOUNDCONNECT_MEDIA_HLS_CLEANUP_CHECK_MS:60000}
  limits:
    imageMaxBytes: 20000000
    audioMaxBytes: 200000000
    videoMaxBytes: 4000000000
  allowedMime:
    image: [image/png, image/jpeg, image/webp]
    audio: [audio/mpeg, audio/mp4, audio/x-m4a, audio/aac, audio/flac, audio/wav, audio/x-wav, audio/ogg]
    video: [video/mp4, video/quicktime, video/x-matroska]
  paths:
    root: media
    hlsDir: hls
    sourceBasename: source

rabbitmq:
  media:
    exchange: ${SOUNDCONNECT_MEDIA_EXCHANGE:media.transcode}
    dlx: ${SOUNDCONNECT_MEDIA_DLX:media.transcode.dlx}
    queues:
      videoHls: ${SOUNDCONNECT_MEDIA_VIDEO_HLS_QUEUE:media.transcode.video.hls}
      videoHlsDlq: ${SOUNDCONNECT_MEDIA_VIDEO_HLS_DLQ:media.transcode.video.hls.dlq}
    routingKeys:
      videoHlsRequest: ${SOUNDCONNECT_MEDIA_VIDEO_HLS_ROUTING_KEY:video.hls.request}
      videoHlsRequestDlq: ${SOUNDCONNECT_MEDIA_VIDEO_HLS_DLQ_ROUTING_KEY:video.hls.request.dlq}
    listenerConcurrency: ${SOUNDCONNECT_MEDIA_LISTENER_CONCURRENCY:1}
    publisherConfirmTimeout: ${SOUNDCONNECT_MEDIA_PUBLISHER_CONFIRM_TIMEOUT:5s}

transcode:
  ladder:
    - { height: 1080, videoBitrate: "6000k", audioBitrate: "192k" }
    - { height: 720,  videoBitrate: "3000k", audioBitrate: "160k" }
    - { height: 480,  videoBitrate: "1200k", audioBitrate: "128k" }
    - { height: 360,  videoBitrate: "600k",  audioBitrate: "96k"  }
  gop: ${SOUNDCONNECT_TRANSCODE_GOP:48}
  preset: ${SOUNDCONNECT_TRANSCODE_PRESET:veryfast}
  crf: ${SOUNDCONNECT_TRANSCODE_CRF:21}
  container: ${SOUNDCONNECT_TRANSCODE_CONTAINER:FMP4}
  segmentDurationSec: ${SOUNDCONNECT_TRANSCODE_SEGMENT_DURATION_SECONDS:4}
  ffmpegBinary: ${FFMPEG_BINARY:ffmpeg}
  ffprobeBinary: ${FFPROBE_BINARY:ffprobe}
  ffprobeTimeoutSec: ${FFPROBE_TIMEOUT_SECONDS:30}
  processTimeoutSec: ${FFMPEG_PROCESS_TIMEOUT_SECONDS:3600}
  sourceDownloadTimeoutSec: ${SOUNDCONNECT_TRANSCODE_SOURCE_DOWNLOAD_TIMEOUT_SECONDS:7200}
  hlsUploadTimeoutSec: ${SOUNDCONNECT_HLS_UPLOAD_TIMEOUT_SECONDS:3600}
  maxDurationSeconds: ${SOUNDCONNECT_TRANSCODE_MAX_DURATION_SECONDS:900}
  maxVideoDimension: ${SOUNDCONNECT_TRANSCODE_MAX_VIDEO_DIMENSION:3840}
  maxVideoPixels: ${SOUNDCONNECT_TRANSCODE_MAX_VIDEO_PIXELS:8294400}
  maxFrameRate: ${SOUNDCONNECT_TRANSCODE_MAX_FRAME_RATE:60.0}
  maxEstimatedOutputBytes: ${SOUNDCONNECT_TRANSCODE_MAX_OUTPUT_BYTES:2147483648}
  maxTempWorkBytes: ${SOUNDCONNECT_TRANSCODE_MAX_TEMP_WORK_BYTES:6442450944}
  globalTempBudgetBytes: ${SOUNDCONNECT_TRANSCODE_GLOBAL_TEMP_BUDGET_BYTES:6442450944}
  tempVolumeBytes: ${SOUNDCONNECT_TRANSCODE_TEMP_VOLUME_BYTES:6442450944}
  tempBudgetAcquireTimeoutSeconds: ${SOUNDCONNECT_TRANSCODE_TEMP_BUDGET_ACQUIRE_TIMEOUT_SECONDS:300}
  minFreeTempBytes: ${SOUNDCONNECT_TRANSCODE_MIN_FREE_TEMP_BYTES:536870912}
  outputEstimateMultiplier: ${SOUNDCONNECT_TRANSCODE_OUTPUT_ESTIMATE_MULTIPLIER:1.20}
  outputFixedOverheadBytes: ${SOUNDCONNECT_TRANSCODE_OUTPUT_FIXED_OVERHEAD_BYTES:16777216}

# --- PULSE MODULE ---
pulse:
  lifecycle-tick-interval-ms: ${SOUNDCONNECT_PULSE_TICK_INTERVAL_MS:5000}

  room-duration-minutes: ${SOUNDCONNECT_PULSE_ROOM_DURATION_MINUTES:30}

  rooms:
    count: ${SOUNDCONNECT_PULSE_ROOM_COUNT:8}

  cooldown:
    seconds: ${SOUNDCONNECT_PULSE_COOLDOWN_SECONDS:1}

  default-topics:
    - "Şu Zamana Geri Dönebilsem..."
    - "Yaşadığın En Büyük Aydınlanma?"
    - "Hayattaki Küçük Mutluluklar"
    - "Son Dinlediğin Şarkı"
    - "Yaşadığın En Saçma Olay?"
    - "Düşünmeden Söyle: Şu Anki Ruh Hâlin?"
    - "Underrated Şarkılar"
    - "Seni Çok Etkileyen Herhangi Birşey?"

soundconnect:
  admin-notifications:
    venue-application-emails: ${SOUNDCONNECT_VENUE_APPLICATION_NOTIFY_TO:backstage@soundconnect.com.tr,berkay@soundconnect.com.tr}
    studio-application-emails: ${SOUNDCONNECT_STUDIO_APPLICATION_NOTIFY_TO:${SOUNDCONNECT_VENUE_APPLICATION_NOTIFY_TO:backstage@soundconnect.com.tr,berkay@soundconnect.com.tr}}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID}
    client-secret: ${SPOTIFY_CLIENT_SECRET}
    token-url: https://accounts.spotify.com/api/token
    api-base-url: https://api.spotify.com/v1
    market: TR

    # prod için kritik:
    http:
      connect-timeout-ms: 2000
      response-timeout-ms: 3500
      read-timeout-ms: 3500
      write-timeout-ms: 3500
