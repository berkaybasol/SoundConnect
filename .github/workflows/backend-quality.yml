name: Backend Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record exact checkout provenance
        run: python3 .github/scripts/capture-provenance.py "$RUNNER_TEMP/source-provenance.json"

      - name: Preserve checkout provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-provenance-${{ github.job }}
          path: ${{ runner.temp }}/source-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test -I scripts/band-test-events.gradle --no-daemon --stacktrace --console=plain 2>&1 | tee band-tests.log

      - name: Require executed marketplace PostgreSQL and security coverage
        run: |
          python3 scripts/test_verify_marketplace_test_reports.py
          python3 scripts/verify_marketplace_test_reports.py build/test-results/test

      - name: Require actual BAND schema, registry, startup and HTTP tests
        run: |
          python3 scripts/test_verify_band_test_reports.py
          python3 scripts/verify_band_test_reports.py build/test-results/test band-tests.log

      - name: Verify existing push migration selection and execution
        run: pwsh -NoProfile -File scripts/verify-push-migrations.ps1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            band-tests.log
          if-no-files-found: error
          retention-days: 7
