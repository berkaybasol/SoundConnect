import org.springframework.boot.gradle.tasks.bundling.BootJar

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.berkayb'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.1'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.mailersend:java-sdk:1.4.1'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // OAUTH2
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // GOOGLE API
    implementation 'com.google.api-client:google-api-client:2.8.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'


    // Spring Boot test altyapısı
    testImplementation 'org.springframework.boot:spring-boot-starter-test'


    // Spring Security test (WithMockUser, MockMvc ile güvenlik)
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'



    // Mockito (unit testlerde mock için)
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'

    // mockwebsertver test
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    testImplementation 'org.awaitility:awaitility:4.2.0'

    // AssertJ (daha okunaklı assertion)
    testImplementation 'org.assertj:assertj-core'

    // test database
    testImplementation 'com.h2database:h2'

    // test rabbitmq
    testImplementation 'org.testcontainers:rabbitmq:1.21.3'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'



    // Amazon
    implementation platform('software.amazon.awssdk:bom:2.26.23')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sts'
    implementation 'software.amazon.awssdk:cloudfront'
    implementation("software.amazon.awssdk:url-connection-client")

    // Template Engine
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // pdf
    implementation 'com.github.librepdf:openpdf:1.3.30'




}

test {
    jvmArgs "-XX:+EnableDynamicAgentLoading"

    // The suite boots several distinct Spring contexts (JPA, RabbitMQ,
    // security and media-worker slices). Bound the worker lifetime so local
    // and CI runs cannot slowly exhaust the heap. Keep Spring's default
    // context-cache size: an artificially small cache can evict a live JPA
    // auditing context while a test class is still using it.
    maxParallelForks = 1
    maxHeapSize = '2g'
    forkEvery = 30
}


tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'analytics-load'
    }
}

// Explicit, isolated database contention check. Never connects to the application
// database or imports application.yml/.env.local; not a production capacity SLA.
tasks.register('venueAnalyticsLoadTest', Test) {
    group = 'verification'
    description = 'Runs bounded venue-reporting concurrency against disposable PostgreSQL.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'analytics-load'
    }
    maxParallelForks = 1
    maxHeapSize = '1g'
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    outputs.upToDateWhen { false }
}

// Keep the developer/IDE default deterministic now that the repository also
// contains a dedicated no-web media-worker entry point.
springBoot {
    mainClass = 'com.berkayb.soundconnect.SoundConnectApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'soundconnect-api.jar'
    mainClass = 'com.berkayb.soundconnect.SoundConnectApplication'
}

tasks.named('bootRun') {
    mainClass = 'com.berkayb.soundconnect.SoundConnectApplication'
}

tasks.register('mediaWorkerBootJar', BootJar) {
    group = 'build'
    description = 'Builds the isolated no-web native media worker artifact.'
    archiveFileName = 'soundconnect-media-worker.jar'
    mainClass = 'com.berkayb.soundconnectworker.MediaWorkerApplication'
    classpath = sourceSets.main.runtimeClasspath
    targetJavaVersion = JavaVersion.VERSION_21
}

tasks.named('assemble') {
    dependsOn tasks.named('mediaWorkerBootJar')
}
